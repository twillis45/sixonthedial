<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six on the Dial Path to Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDEEF0; --surface:#FFFFFF; --surface-2:#E3E5E8; --sunk:#D9DCE0;
  --ink:#15171A; --ink-2:#4A505A; --ink-3:#7F8791;
  --rule:#D3D7DC; --rule-2:#B3B9C1;
  --accent:#12657D; --accent-soft:#12657D14;
  --ok:#256B4F; --ok-soft:#256B4F14;
  --warn:#8A5A08; --warn-soft:#8A5A0814;
  --crit:#B4342A; --crit-soft:#B4342A14;
  --shadow:0 1px 2px rgba(18,22,28,.07), 0 10px 30px rgba(18,22,28,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --surface:#1A1D21; --surface-2:#22262B; --sunk:#0D0F12;
    --ink:#ECEEF1; --ink-2:#98A0AA; --ink-3:#6A727C;
    --rule:#292E34; --rule-2:#3A4149;
    --accent:#4FBEDC; --accent-soft:#4FBEDC1C;
    --ok:#5FBE95; --ok-soft:#5FBE951C;
    --warn:#D6A23F; --warn-soft:#D6A23F1C;
    --crit:#E5705F; --crit-soft:#E5705F1C;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1A1D21; --surface-2:#22262B; --sunk:#0D0F12;
  --ink:#ECEEF1; --ink-2:#98A0AA; --ink-3:#6A727C;
  --rule:#292E34; --rule-2:#3A4149;
  --accent:#4FBEDC; --accent-soft:#4FBEDC1C;
  --ok:#5FBE95; --ok-soft:#5FBE951C;
  --warn:#D6A23F; --warn-soft:#D6A23F1C;
  --crit:#E5705F; --crit-soft:#E5705F1C;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,sans-serif;font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1020px;margin:0 auto;padding:0 20px 96px}

.kick{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap;margin:0 0 16px}
header.top{padding:50px 0 26px;border-bottom:1px solid var(--rule-2)}
h1{font-family:"Archivo",system-ui,sans-serif;font-weight:700;
  font-size:clamp(30px,5.2vw,48px);line-height:1.02;letter-spacing:-.032em;margin:0 0 14px;text-wrap:balance}
.sub{font-size:clamp(15px,1.9vw,17.5px);line-height:1.55;color:var(--ink-2);max-width:64ch;margin:0}
.sub strong{color:var(--ink);font-weight:600}

.gate{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap;
  border:1px solid var(--rule);border-left:3px solid var(--crit);background:var(--surface);
  padding:18px 20px;margin:26px 0 0;box-shadow:var(--shadow)}
.gate .mark{font-family:"Archivo",sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--crit);white-space:nowrap;padding-top:2px}
.gate .t{font-weight:600;margin:0 0 4px;color:var(--ink)}
.gate p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.55;max-width:70ch}
.gate .body{flex:1 1 320px}

.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin:26px 0 0}
.bar{background:var(--surface);padding:15px 16px 14px}
.bar .n{font-family:"Archivo",sans-serif;font-weight:700;font-size:27px;line-height:1;
  letter-spacing:-.02em;display:block;font-variant-numeric:tabular-nums}
.bar .l{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin:7px 0 10px}
.bar .track{height:3px;background:var(--sunk)}
.bar .fill{height:3px;background:var(--ink-3)}
.bar.acc .n{color:var(--accent)} .bar.acc .fill{background:var(--accent)}
.bar.crit .n{color:var(--crit)} .bar.crit .fill{background:var(--crit)}
.bar.ok .n{color:var(--ok)} .bar.ok .fill{background:var(--ok)}

.tracks{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);margin:22px 0 0;flex-wrap:wrap}
.tracks button{flex:1 1 auto;appearance:none;border:0;background:var(--surface);color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  padding:13px 14px;cursor:pointer;min-height:44px}
.tracks button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tracks button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}

.stage{border:1px solid var(--rule);border-top:0;background:var(--surface)}
.stage.folded .stage-hd{border-bottom:0}
.stage.folded .stage-t{color:var(--ink-3)}
.fold{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--rule-2);padding:2.5px 6px;white-space:nowrap}
.tracks.showdone{margin-top:1px}
.tracks.showdone button{flex:0 0 auto}
.stage:first-of-type{border-top:1px solid var(--rule);margin-top:30px}
.stage-hd{display:flex;align-items:baseline;gap:13px;padding:15px 18px;background:var(--surface-2);
  border-bottom:1px solid var(--rule)}
.stage-n{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--ink-3);
  letter-spacing:.06em}
.stage-t{font-family:"Archivo",sans-serif;font-weight:600;font-size:15.5px;letter-spacing:-.012em;flex:1}
.stage-c{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.stage.clear .stage-c{color:var(--ok)}

.items{list-style:none;margin:0;padding:0}
.item{display:flex;gap:13px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.box{flex:0 0 auto;width:19px;height:19px;margin-top:2px;padding:0;cursor:pointer;
  border:1.5px solid var(--rule-2);background:var(--bg);color:transparent;
  display:grid;place-items:center;border-radius:2px}
.box:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.box[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.box[disabled]{cursor:default;opacity:.55}
.box svg{width:11px;height:11px;display:block}
.item .body{flex:1;min-width:0}
.title{margin:0;font-size:15px;font-weight:500;line-height:1.45;color:var(--ink)}
.item.done .title{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.note{margin:5px 0 0;font-size:13.5px;line-height:1.55;color:var(--ink-2);max-width:78ch}
.item.done .note{color:var(--ink-3)}
.tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:2.5px 6px;margin-left:8px;border:1px solid currentColor;vertical-align:1.5px;white-space:nowrap}
.tag.todd{color:var(--accent);background:var(--accent-soft)}
.tag.blocker{color:var(--crit);background:var(--crit-soft)}
.tag.now{color:var(--crit);background:var(--crit-soft)}
.tag.gap{color:var(--warn);background:var(--warn-soft)}
.tag.blocked{color:var(--ink-3)}
.tag.partial{color:var(--warn);background:var(--warn-soft)}

footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:34px;
  padding-top:18px;border-top:1px solid var(--rule);
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

.savechip{position:fixed;right:14px;bottom:14px;background:var(--ink);color:var(--bg);
  font-family:"IBM Plex Mono",monospace;font-size:11px;padding:8px 12px;opacity:0;
  transition:opacity .2s;pointer-events:none;max-width:min(88vw,340px)}
.savechip.on{opacity:1}
.savechip.warn{background:var(--warn);color:#12140f}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

 /* ================= BUILD ================= */
 {k:"b1a",tr:"b",s:1,d:1,t:"Mechanic defined &mdash; six letters on a dial, six rows to fill",n:"The constraint that governs everything downstream: a base is only ever six letters, so <em>mantle</em> and <em>mental</em> are the same puzzle wearing different names."},
 {k:"b1b",tr:"b",s:1,d:1,t:"Themed content named as the paid half",n:"300 hand-authored puzzles across 15 themes, most describing Black American cultural life. <em>docs/CULTURAL_BOARD.md</em> governs who reviews it and under what limits."},
 {k:"b1c",tr:"b",s:1,d:1,t:"On-theme rate adopted as a floor, never a target",n:"0.710 across 590 rows, measured today. It caught a real disaster once, taking the catalogue from 0.216 to 0.62 &mdash; and chasing it past its useful range is how a vocabulary got padded and a rate got reported as 0.58 when the truth was 0.34."},
 {k:"b1h",tr:"b",s:1,t:"Gate zero must run on a GENERAL board, not a cultural one",n:"Sitting 2 ruling. The cold-profile ladder is crafty (Barbecue) and nicked (The Nineties) &mdash; both culturally specific, chosen by difficulty sort and not by anyone. As configured the test cannot tell its own failure modes apart: a Miss might be &ldquo;the mechanic is unclear&rdquo; or &ldquo;the clue is outside my world&rdquo;, and those need opposite fixes. Garden and tailgate are general and both ship. A test-rig change, not a product one.",tag:"blocker"},
 {k:"b1i",tr:"b",s:1,t:"Decide which board a first-timer actually meets",n:"Sitting 2, referred to the operator. A first-time player&rsquo;s first board is cultural BECAUSE the difficulty sort put it there &mdash; a default, not a decision. Leading with the packs is defensible; nobody has chosen it. The same clue that delights an insider can read as a locked door to somebody it was not written for.",tag:"todd"},
 {k:"b1g",tr:"b",s:1,t:"Run gate zero &mdash; twelve strangers, four first-runs",n:"<em>docs/gate0.html</em>. Built, kill rule frozen at 60% Read and max 20% Quit, never run. The player bench predicts seat 1 is gone at 0:40 because the board never says the goal in words &mdash; but a persona cannot rage-quit, so the prediction is worth nothing until a real hallway tests it. Below 40% Read on EVERY variant means the mechanic is the problem, not the copy.",tag:"blocker"},
 {k:"b1d",tr:"b",s:1,d:1,t:"Competitor sweep across the daily-word category",n:"<em>docs/COMPETITIVE.md</em>. The finding that matters: the letter wheel is NOT ours &mdash; Wordscapes is built on it and leads the category on revenue, so no copy may imply we are alone in it. Differentiation is the six-letter anagram family, the cited themed clues, and being finite. Also surfaced a real tradeoff: the category leader earns roughly 55% from ads, and this product ships zero ad SDKs by deliberate choice."},
 {k:"m9p",tr:"m",s:9,d:1,t:"Never write &ldquo;only&rdquo;, &ldquo;first&rdquo; or &ldquo;unique&rdquo; about the wheel",n:"<em>REVIEW_2026-08-26_DECISIONS.md</em>. CONFIRMED, plus the adjacent trap: do not describe the themed packs as teaching or explaining Black culture to anyone. They are made for the people in them first."},
 {k:"b1j",tr:"b",s:1,t:"Settle the business model after gate zero",n:"Sitting 3 reopened it. Ruling 3 asked paid-packs vs ads vs subscription and never asked paid DOWNLOAD vs free download &mdash; the operator found that gap. Three live options: paid download (Google collects, no billing code, kills the share loop), free plus one-time unlock (identical economics, keeps the loop, costs Play Billing), free plus per-pack. The create-app form is set PAID because free&rarr;paid cannot be undone after publish and paid&rarr;free can.",tag:"todd"},
 {k:"b1e",tr:"b",s:1,d:1,t:"Business model &mdash; free, paid packs, or both",n:"<em>REVIEW_2026-08-26_DECISIONS.md</em>. RULED: free daily puzzle, themed packs sold outright. No ads (they reverse the COPPA ruling and a filed privacy claim). No subscription (it is a promise about cadence that 118 boards across 14 themes cannot keep). Consequence: store row 4.1 goes live &mdash; IAP, StoreKit, and entitlement that cannot live in localStorage."},

 {k:"b2a",tr:"b",s:2,d:1,t:"Four authoring rules written with their measurements attached",n:"<em>docs/AUTHORING.md</em>. Each rule was bought with a mistake rather than reasoned out in advance."},
 {k:"b2b",tr:"b",s:2,d:1,t:"Density gate runs before authoring, not after",n:"<em>viability.mjs</em>. It was not run for Laundry Day or Caribbean; both were written, shipped, found unfixable at any wheel size, and cut."},
 {k:"b2c",tr:"b",s:2,d:1,t:"Authoring runs against the vetted base pool",n:"<em>vet-bases.mjs</em> writes every base the build would accept. Authoring the first two packs without it cost seven full re-authors, and skipping the anagram check cost fourteen boards."},
 {k:"b2d",tr:"b",s:2,d:1,t:"Seventh letter ruled out, with the number that ruled it",n:"Answers per board roughly double, 43 &rarr; 91 &mdash; which changes the product from a one-to-three board sitting into a Spelling Bee style hunt, and costs a full re-tune of the wheel geometry. Revisit only if longer sessions are wanted."},
 {k:"b2e",tr:"b",s:2,d:1,t:"One doubled letter permitted in a base",n:"The old six-distinct rule threw away 76 usable theme words. Capped at one pair because two pairs leaves four distinct letters &mdash; CHURCH yields three answers total."},
 {k:"b2f",tr:"b",s:2,d:1,t:"Rank ladder and board marks redesigned flat",n:"Rank now reads as encoding rather than dimensional decoration."},
 {k:"b2g",tr:"b",s:2,d:1,t:"Theme polish shipped &mdash; studio, dark, light",n:"Trap worth knowing before touching it: the light theme is declared TWICE in <em>globals.css</em>, and patching one block without the other has caused two separate bugs."},
 {k:"b2h",tr:"b",s:2,d:1,t:"Two accents a colour-blind player can actually separate",n:"Tide and Plum. Added because the shipped pair was not distinguishable, and the fix was measured rather than eyeballed."},
 {k:"b2i",tr:"b",s:2,t:"stoop &mdash; a theme already paid for, with zero boards",n:"107 usable words, density 159. Still the cheapest win in the catalogue &mdash; but it is a CULTURAL pack, and the pipeline&rsquo;s own rule places it behind bench sign-off, which is why tailgate went first. Authoring it is writing about Black American life and belongs behind the same gate as every other cultural pack.",tag:"blocked"},
 {k:"b2j",tr:"b",s:2,d:1,t:"tailgate &mdash; authored, merged, shipping",n:"Six boards, 0.733 on-theme, opens on HOARSE &mdash; the prize base the anagram-twin fix rescued from ASHORE. Two pipeline traps closed on the way: puzzles.json is generated by build-puzzles rather than next build, and the picker&rsquo;s shelf map needed a tailgate entry or Grandmother&rsquo;s five-shelf veto fires. Catalogue 118 &rarr; 124."},
 {k:"b2k",tr:"b",s:2,d:1,t:"Depth for the six shallow packs &mdash; resolved against the bench record",n:"The item as written misread the record. For five of the six, shallowness is a standing bench ruling or a structural fact: spades is &ldquo;honestly small&rdquo; by ruling, steppers/gogo was capped at 12 &ldquo;rather than let it be padded&rdquo;, juneteenth&rsquo;s identity is proper nouns the letter filter deletes, sitcom was refused and re-centred, beautysupply ships under binding constraints. Deepening them overrides the bench. GARDEN was the exception &mdash; general, no gate &mdash; and grew 91 &rarr; 149 words under the padding test, with every kitchen/hardware/cookout collider dropped and food plants kept per the corpus&rsquo;s own precedent."},
 {k:"b2l",tr:"b",s:2,d:1,t:"Prize words for the six packs that own none &mdash; the calls made",n:"Delegated by the operator. GARDEN: HARDEN accepted &mdash; hardening off is real technique jargon, not a PLATES, and it now bases a board (GROWTH swapped out, rate-neutral, prize opening gained). The other five: the call is NO. prize-words shows zero viable candidates inside their signed-off vocabularies, and minting one means padding &mdash; the exact move the bench refused twice in writing. A prize word those packs did not earn would be worse than none."},

 {k:"b3a",tr:"b",s:3,d:1,t:"Static export ships on GitHub Pages"},
 {k:"b3b",tr:"b",s:3,d:1,t:"Service worker is network-first with cache: 'no-store'",n:"Stronger than it sounds: a bare fetch still consults the HTTP cache, and Pages sends max-age on HTML, so network-first would otherwise quietly degrade to whatever the browser kept."},
 {k:"b3c",tr:"b",s:3,d:1,t:"Daily reminder ships as a calendar file",n:"RFC 5545 &mdash; CRLF, folding at 75 octets, floating local time so it fires at the player's morning rather than a timezone's."},
 {k:"b3d",tr:"b",s:3,d:1,t:"Feedback intensity and accent under the player's control"},
 {k:"b3e",tr:"b",s:3,d:1,t:"Android TWA wrapper &mdash; built and signed",n:"app-release-bundle.aab, 1.15MB, jarsigner verified. Four identity fields agree end to end &mdash; assetlinks.json, gradle applicationId, twa-manifest and the origin in strings.xml &mdash; which caught a wizard that had silently written com.sixonthedial.twa against assetlinks&rsquo; .game and would have built green and shown an address bar. assetlinks now carries BOTH fingerprints, so a sideloaded build verifies too."},
 {k:"b3j",tr:"b",s:3,t:"Upload the bundle to internal testing",n:"The artifact exists and production serves both fingerprints. What remains is a console upload and a tester list &mdash; then the single observation the whole domain effort was for: address bar, or no address bar.",tag:"todd"},
 {k:"b3f",tr:"b",s:3,d:1,t:"iOS &mdash; wrapper or a real client",n:"<em>REVIEW_2026-08-26_DECISIONS.md</em>. RULED: defer iOS, ship Android first. What exists is a static export with no native capability, which is the textbook shape 4.2 rejects, and a rejection attaches to the account. A widget, Live Activity or Game Center would be a real answer &mdash; that is a build, not a wrap."},
 {k:"b3g",tr:"b",s:3,t:"Crash reporting",n:"None today. A store build without it is blind to everything a player hits.",tag:"gap"},

 {k:"b4a",tr:"b",s:4,d:1,t:"317 tests across 14 files"},
 {k:"b4b",tr:"b",s:4,d:1,t:"Rail holds at 108 viewport and text-size combinations",n:"Includes a browser-font axis driven through CDP. An earlier version set that font size before documentElement existed, so 26 rows passed vacuously &mdash; measuring nothing while reporting green."},
 {k:"b4c",tr:"b",s:4,d:1,t:"Mutation harness, locked against concurrent runs",n:"Added after a shared browser profile leaked played state between runs and an audit read a constant mid-mutation."},
 {k:"b4d",tr:"b",s:4,d:1,t:"assetlinks.json held to exactly two legal states",n:"Red-proofed against the two most likely wrong values: a SHA-1 from the adjacent Play Console screen, and lowercase hex. Android does not error on a mismatch &mdash; it silently falls back to a visible address bar, which is the exact &ldquo;repackaged website&rdquo; read this avoids."},
 {k:"b4e",tr:"b",s:4,d:1,t:"Canon citations fail the build when a cited clue is edited",n:"A clue is a factual claim wearing a joke. Editing cited text without updating the canon entry means the citation vouches for something nobody checked."},
 {k:"b4f",tr:"b",s:4,d:1,t:"Every marketing still asserts the look it claims to be",n:"Caught ten stills shot on the wrong accent, which would otherwise have reached a landing page."},
 {k:"b4g",tr:"b",s:4,d:1,t:"Store preview asserted against Apple's published spec",n:"Caught a master at 14.8s &mdash; two tenths under the 15-second floor &mdash; that would have shipped silently."},
 {k:"b4h",tr:"b",s:4,t:"Drag tested on a real finger",n:"The geometry is guarded headless and the bug reproduces on demand, but a thumb is not a mouse.",tag:"todd"},
 {k:"b4i",tr:"b",s:4,d:1,t:"Nielsen heuristic pass on the playable surface",n:"No P0 or P1. One P2: a spent hint has no undo, though it is guarded by a two-step chooser with prices shown and 44px targets 95px apart &mdash; measured, after the mistap risk was hypothesised and did not survive. Resume verified live. Ran INLINE rather than clean-room, so it is biased toward what the session already knew and is worth redoing cold."},
 {k:"b4j",tr:"b",s:4,d:1,t:"WCAG AA audit &mdash; contrast, targets, motion preference",n:"<em>check-a11y.mjs</em>: 189 text boxes across six surface/theme combinations, zero failures, red-proofed at 118 caught. The finding count went 101 &rarr; 19 &rarr; 13 &rarr; 3 &rarr; 0 and every step was a defect in the instrument, not a fix to the app &mdash; including six bugs nearly filed against a correct reduced-motion accommodation. It refuses to report anything until it recovers four known ratios at 12px, 13px and 44px."},
 {k:"b4l",tr:"b",s:4,d:1,t:"Raise the four header controls from 36 to 44 &mdash; WITHDRAWN",n:"They were ALREADY 44 on a phone: <em>h-9 w-9 touch:h-11 touch:w-11</em>. The guard set width and height but not hasTouch, so the touch variant never applied and it measured a size no phone renders. Twenty seats then ruled on that number. The worst instrument defect of the session, because it produced a decision rather than a reading &mdash; and the only thing that caught it was measuring again."},
 {k:"b4m",tr:"b",s:4,t:"Nine 24px-tall pills on phone &mdash; Shuffle, bonus, puzzles chip, hint rows",n:"The real list, once twelve phantom findings were removed. All clear WCAG&rsquo;s 24px floor; all sit under Apple&rsquo;s 44 thumb bar. The hint rows were already ruled to stay. The other three were never ruled because they were buried.",tag:"todd"},
 {k:"b4k",tr:"b",s:4,d:1,t:"Old &rarr; new service-worker transition &mdash; fully observed",n:"CLOSED on the tailgate deploy. A tab on the old stamp, one natural navigation, and the whole chain ran unaided: update check, install, activate, cache swept to exactly one entry at the new stamp, controllerchange, and the document reloaded ITSELF &mdash; navigation.type reads reload on a tab nobody touched. The earlier non-fire was the forced-update test rig, not the fix. Owed since 2026-08-17."},

 {k:"b6a",tr:"b",s:6,d:1,t:"sixonthedial.com serves the app from the origin root"},
 {k:"b6b",tr:"b",s:6,d:1,t:"assetlinks.json returns 200 from the origin root",n:"The path this repo structurally could not publish while it lived on github.io, because it belonged to the user-pages repo. This is the gate that used to block the entire Android track."},
 {k:"b6c",tr:"b",s:6,d:1,t:"HTTPS enforced; www and three defensive domains 301 with paths preserved"},
 {k:"b6d",tr:"b",s:6,d:1,t:"Version and build numbering scheme",n:"<em>src/lib/version.ts</em>, 14 tests. versionCode is YYMMDD*100+seq; the function throws rather than encodes at 2100, where a two-digit year wraps to 00 and codes start going BACKWARDS &mdash; the one failure Play cannot forgive. Moves rarely by design: only a manifest or intent-filter change needs a new binary."},
 {k:"b6e",tr:"b",s:6,d:1,t:"Staged rollout and rollback plan",n:"The fact usually got wrong: neither store can roll a release BACK. Play halts a rollout; nobody withdraws a published build. The web layer is the real rollback &mdash; revert and redeploy, and network-first no-store takes it on one online load. Hold the rollout at least one full daily cycle, because a bug in daily rollover is invisible inside an hour."},
 {k:"b3h",tr:"b",s:3,d:1,t:"Crash reporting",n:"<em>REVIEW_2026-08-26_DECISIONS.md</em>. RULED: no third-party reporter. It would trade a filed privacy position for telemetry on a binary that by design almost never changes. Covered instead by the web layer being the rollback and a rollout staged across a full daily cycle. First-party opt-in later if genuinely wanted."},

 {k:"b7a",tr:"b",s:7,d:1,t:"HANDOFF.md refreshed against current main",n:"It had said Android needs a custom domain before it can start, which closed on 2026-08-21 &mdash; so a cold reader got the single biggest gate wrong. Now carries the leverage order, the corrected test count, and the ten days of work the file had missed."},
 {k:"s5j",tr:"s",s:5,d:1,t:"Sweep the clue corpus for age-appropriateness",n:"<em>check-rating.mjs</em>: 132 boards, 1,848 strings, 21 hits, 20 of them false positives &mdash; pot liquor, chicken breast, the number forty, Brandy the singer, and dictionary words the bases happen to spell. The setting-is-not-content claim held. ONE real hit remains, below."},
 {k:"s5k",tr:"s",s:5,d:1,t:"Rule the one real tobacco reference",n:"REWRITTEN by operator ruling, and the reason recorded in the decisions doc rather than left in a diff &mdash; a rewrite nobody explains becomes indistinguishable from what was always there. The sweep now reports zero tobacco hits and ruling 2 is no longer provisional. What was given up is written down: an observed detail removed because a form asked."},
 {k:"b9a",tr:"b",s:9,d:1,t:"Re-score the ten wings",n:"<em>SCORECARD_2026-08-27.md</em>. Three wings hold at 9 on measured evidence &mdash; layout, accessibility, security. Two are UNSCORED rather than guessed, because gate zero has never run. Two are genuinely low: monetization is a ruling with no code, retention has no data point at all. The surface scores BLOCKED, not an average &mdash; wing 9 holds a live block and no engineering moves it."},
 {k:"b9b",tr:"b",s:9,t:"Wing 9 is the lowest dimension, and it gates the score",n:"The board convention is that a surface scores as its LOWEST dimension, and Cultural Authenticity holds authority to block content. No pack has had a community reader, so this wing cannot be at 9 today &mdash; which means no amount of engineering reaches 9/10 overall. This is the honest ceiling on autonomous work.",tag:"blocker"},
 {k:"b7b",tr:"b",s:7,d:1,t:"Traps recorded where they will actually be hit",n:"Light theme declared twice; spellability is a multiset question, not a set one; merge-pack refuses on check-pack failure after an unspellable row once reached the catalogue."},
 {k:"b7c",tr:"b",s:7,d:1,t:"No analytics, by design and by structure",n:"connect-src 'self' in the shipped CSP makes it a property of the build rather than a promise in a document."},

 {k:"b8a",tr:"b",s:8,d:1,t:"Cache is swept at activate, not accumulated",n:"CACHE is the build id; activate deletes every key that is not current, then claims clients. A controlled page reports exactly one cache."},
 {k:"b8b",tr:"b",s:8,d:1,t:"Catalogue ratchet gates the corpus"},

 /* ================= STORE &amp; LEGAL ================= */
 {k:"s1a",tr:"s",s:1,d:1,t:"Apple guideline 4.2 &mdash; minimum functionality",n:"<em>REVIEW_2026-08-26_DECISIONS.md</em>. RULED: do not submit a wrapper. Android has no equivalent risk and every remaining Android blocker is one signup away."},

 {k:"s5a",tr:"s",s:5,d:1,t:"Privacy policy, terms and support URL published"},
 {k:"s5b",tr:"s",s:5,d:1,t:"Apple nutrition labels &mdash; file as Data Not Collected",n:"Measured, not assumed: zero analytics or tracker SDKs in source or export, three runtime dependencies total, and four fetch sites of which none reaches a third party in a shipped build."},
 {k:"s5c",tr:"s",s:5,d:1,t:"Play Data Safety &mdash; no data collected",n:"Must stay in step with the Apple answer. On-device localStorage keys are storage, not collection &mdash; nothing transmits them."},
 {k:"s5d",tr:"s",s:5,d:1,t:"ENABLE1 wordlist license recorded"},
 {k:"s5e",tr:"s",s:5,d:1,t:"WordNet definitions license recorded"},
 {k:"s5f",tr:"s",s:5,d:1,t:"COPPA and the target age band",n:"<em>REVIEW_2026-08-26_DECISIONS.md</em>. RULED: Everyone / 4+ with no data collected &mdash; already true rather than promised, since COPPA exposure here lives in ads and analytics and neither exists. CONTINGENT on the privacy line: an ad, analytics or third-party crash SDK reverses it."},
 {k:"s5g",tr:"s",s:5,t:"Content rating &mdash; FILE the IARC questionnaire",n:"The ANSWER is settled: Everyone / 4+, no longer provisional now the corpus sweep has run and the tobacco clue is rewritten. What is not done is filing it &mdash; the questionnaire lives in the console and nobody has submitted it.",tag:"todd"},
 {k:"s5h",tr:"s",s:5,t:"Trademark clearance on the name and on theme text",n:"The knockout search is done. Full clearance is not.",tag:"partial"},
 {k:"s5i",tr:"s",s:5,t:"One real community reader per pack",n:"Store row 1.10, and the limit CULTURAL_BOARD.md states plainly: the bench is structured perspective, NOT community consultation. A reader is budgeted per pack before anything ships commercially, and it has not been done for a single pack.",tag:"blocker"},

 {k:"s4a",tr:"s",s:4,t:"IAP and Play Billing for digital goods",n:"Both stores require their own billing for digital goods, with no exception for a web wrapper.",tag:"blocked"},
 {k:"s4b",tr:"s",s:4,t:"Restore purchases",n:"Apple requires it explicitly.",tag:"blocked"},
 {k:"s4c",tr:"s",s:4,t:"Receipt validation",n:"Today all state is localStorage, which a player can edit. Entitlement cannot live there.",tag:"blocked"},
 {k:"s4d",tr:"s",s:4,t:"Price tiers, tax and payouts",tag:"blocked"},

 {k:"s6a",tr:"s",s:6,t:"Apple Developer Program &mdash; $99/yr",n:"Enrollment can take days. It is the long pole nobody notices until it is the only thing left.",tag:"todd"},
 {k:"s6b",tr:"s",s:6,d:1,t:"Google Play Developer &mdash; $25 once",n:"DONE 2026-08-27. Organization account under the LLC. Organization was right twice: a personal account cannot be converted later without support, and the 12-testers-for-14-days rule applies only to personal accounts &mdash; organizations are exempt, saving two weeks at submission."},
 {k:"s6c",tr:"s",s:6,d:1,t:"Create the Play app and enrol in Play App Signing",n:"The account alone does NOT produce the fingerprint. It lives at Setup &rarr; App signing &rarr; App signing key certificate &rarr; SHA-256, which exists only once the app is created and Play App Signing holds a key. Critically it must be the PLAY-MANAGED signing certificate, not the upload certificate &mdash; they differ, and using the upload one is a documented TWA rejection cause. Sequencing note: the board put gate zero ahead of the listing, and this step needs the app shell to exist but not to be published.",tag:"blocker"},
 {k:"s6d",tr:"s",s:6,d:1,t:"Play target API level checked at build time",n:"Measured on the built bundle rather than assumed: compileSdk 36, targetSdk 36, minSdk 21. Bubblewrap targets current, which is what Play&rsquo;s rolling minimum asks. Worth re-reading at each binary release, since the deadline moves and the binary ships rarely."},

 /* ================= MARKETING ================= */

 /* ---- MARKETING ROADMAP, full spine, per the spades/snug precedent ---- */
 {k:"m1a",tr:"m",s:1,d:1,t:"Acquisition thesis stated: the share loop, not spend",
  n:"Wordle grew on a pasted grid, and the board's rulings close every paid door on purpose: no ads (reverses the COPPA position), no UA (the leader's 55%-ad business is a different product). What is left is the loop the category invented — a daily result someone chooses to paste — plus the packs as word-of-mouth. This is a thesis, and gate zero and the store curve are what test it."},
 {k:"m1b",tr:"m",s:1,d:1,t:"The measurement constraint, stated before it surprises anyone",
  n:"connect-src 'self' and zero analytics means marketing here is blind BY DESIGN: no UTM lands anywhere, no share is counted, no visit is logged (GitHub Pages keeps no logs). The only instruments that will ever exist are the store consoles (installs, ratings) and reviews. Every roadmap item below has to be judged by those or by nothing — and that is the privacy position working, not a gap."},
 {k:"m2p",tr:"m",s:2,t:"Audit the share text as the growth engine it has to be",
  n:"shareText() exists and ships. Nobody has audited it against the convention Wordle set: does it provoke a question from someone who has never seen the game, does it carry rank and streak without spoiling the board, does it read right pasted into a group chat? This is the one marketing surface with distribution built in, and it deserves the same measured pass the rail got."},
 {k:"m2q",tr:"m",s:2,t:"Press kit on the domain",
  n:"The flat composites, the store preview, the fact sheet, and the claim ledger's checked sentences — one page at sixonthedial.com/press. Everything on it already exists in store/; this is assembly, not authoring."},
 {k:"m3p",tr:"m",s:3,t:"Launch-week content cut from the capture pipeline",
  n:"60 self-asserting stills and three clips exist. A launch week needs them recut per placement — vertical for Reels/TikTok, square for feed, the 886x1920 master for the store. The pipeline regenerates on demand, so this is a cut list, not a reshoot. Theme choice for the campaign is still the operator's call (m9n)."},
 {k:"m4p",tr:"m",s:4,d:1,t:"Every outbound sentence passes the claim ledger",
  n:"check:listing already holds the store copy to it — seven field limits plus the two board rules, red-proofed. The rule extends to any post or pitch: a sentence with no check behind it does not ship. LISTING.md's deliberately-unmade claims (no retention language, no player counts, no bare &ldquo;accessible&rdquo;) bind here too."},
 {k:"m5p",tr:"m",s:5,d:1,t:"Privacy claims and marketing claims are the same claims",
  n:"The description says no ads, no account, nothing leaves the device; the nutrition labels say Data Not Collected; the CSP makes it structural. One person reads all three minutes apart, and they agree because they are generated from the same facts. Any future marketing tool that wants a pixel reopens ruling 2 and does not get to sneak in as a tag."},
 {k:"m6p",tr:"m",s:6,t:"Launch outreach list, pitched under the framing rule",
  n:"Play-first staged rollout IS the launch event. Alongside it: word-game communities and press who cover the category, and Black culture and tech outlets for the packs — pitched as work made for the people in them first, never as a lesson for anyone else (Karen S.'s trap, now a board rule). Sending is the operator's hand; the list and the one-paragraph pitch per outlet can be drafted cold.",tag:"todd"},
 {k:"m7p",tr:"m",s:7,t:"The post-launch dashboard is two numbers and the reviews",
  n:"Installs and rating from the consoles, read weekly, plus every review read as the only user-research channel this product will ever have (no crash reporting by ruling 4, no analytics by design). Write the cadence down or the consoles never get opened — that is the failure mode of a dashboard nobody owns."},
 {k:"m8p",tr:"m",s:8,t:"ASO iterated on observed ranks, not guessed ones",
  n:"The shipped keywords are reasoned, not researched — recorded honestly in LISTING.md. Once listed, the consoles show real impression and conversion data, which is the first ASO instrument this project will actually possess. Iterate then, not now.",tag:"blocked"},
 {k:"m9q",tr:"m",s:9,t:"Price the packs with evidence, not taste",
  n:"Ruling 3 sells packs outright and no number exists. The comparables are already in COMPETITIVE.md — NYT at $6/mo for five dailies, Wordscapes free-with-ads — and neither maps cleanly onto 300 hand-authored cited puzzles. A price needs its first evidence before it ships; the portfolio's own ten-send discipline applies.",tag:"todd"},
 {k:"m10p",tr:"m",s:10,t:"What transfers when this ships or stops",
  n:"The capture pipeline, the claim-ledger listing check, the gate-zero protocol and the self-publishing tracker all came FROM the snug and spades sessions and went back improved. Recording what transfers is what makes any outcome an asset — the spades closing memo is the precedent."},
 {k:"m9a",tr:"m",s:9,d:1,t:"Domain registered, canonical and defended"},
 {k:"m9b",tr:"m",s:9,d:1,t:"App icon &mdash; 1024 for iOS, 512 for Play"},
 {k:"m9c",tr:"m",s:9,d:1,t:"Play feature graphic, 1024&times;500"},
 {k:"m9d",tr:"m",s:9,d:1,t:"iPhone screenshots"},
 {k:"m9e",tr:"m",s:9,d:1,t:"Play phone screenshots"},
 {k:"m9f",tr:"m",s:9,d:1,t:"60 marketing stills, each asserting its own look",n:"Two frames &times; six looks &times; five states, and the run fails rather than reporting green when a still is not the theme and accent it claims."},
 {k:"m9g",tr:"m",s:9,d:1,t:"12 mockups &mdash; six framed, six full-bleed",n:"The perspective rotation was dropped: rotateY(-7deg) turned a circular dial into an ellipse, which reads as a rendering bug rather than a product shot."},
 {k:"m9h",tr:"m",s:9,d:1,t:"Three campaign clips driven from the shipped build",n:"Recorded as timestamped frames rather than a screencast, because screencast records the OS window surface and ignores device scale factor."},
 {k:"m9i",tr:"m",s:9,d:1,t:"Store preview master &mdash; 17.9s, 886&times;1920, High L4.0, stereo",n:"886&times;1920 is the only iPhone preview resolution Apple accepts, across every modern display size from 6.1&Prime; to 6.9&Prime;."},
 {k:"m9j",tr:"m",s:9,t:"Preview audio &mdash; a real mix, not the silent compliance track",n:"The silent stereo track satisfies the specification and nothing else. The game's tones are in C major deliberately, and the capture pipeline cannot record page audio.",tag:"gap"},
 {k:"m9k",tr:"m",s:9,t:"iPad screenshots",n:"Only if the iOS build declares iPad support. Shipping iPhone-only first is cheaper."},
 {k:"m9l",tr:"m",s:9,d:1,t:"Description, subtitle and keywords",n:"<em>docs/LISTING.md</em> &mdash; written as a claim ledger, where every sentence is paired with the check behind it and a sentence with no check does not ship. <em>check:listing</em> enforces the seven character limits and both board rules, red-proofed on each. Subtitle lands at exactly 30/30."},
 {k:"m9m",tr:"m",s:9,t:"Privacy-policy URL pasted into both listings",n:"The policy is published (row 1.1). This is the paste, and it happens inside the store consoles &mdash; so it waits on the accounts."},
 {k:"m9n",tr:"m",s:9,t:"Which theme fronts the campaign",n:"Every clip and still currently runs on THE PIT &middot; BARBECUE. That is a content decision as much as a visual one, and the themed packs are the cited half of the game.",tag:"todd"},
 {k:"m9o",tr:"m",s:9,t:"ASO keyword research",n:"The category is crowded and the leaders open on gameplay inside three seconds. Nothing here has been researched against actual search terms.",tag:"gap"}
];

var TRACKS=[["b","Build"],["s","Store &amp; legal"],["m","Marketing"]];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function txt(s){return s;}
function isDone(it){return STATE.done[it.k]!==undefined?!!STATE.done[it.k]:!!it.d;}

function render(){
  var tr=STATE.track||'b';
  var shown=ITEMS.filter(function(i){return i.tr===tr;});
  var all=ITEMS.length,done=ITEMS.filter(isDone).length;
  var toddOpen=ITEMS.filter(function(i){return i.tag==='todd'&&!isDone(i);}).length;
  var blockers=ITEMS.filter(function(i){return i.tag==='blocker'&&!isDone(i);}).length;
  var v=ITEMS.filter(function(i){return i.s===4&&i.tr==='b';});
  var vDone=v.filter(isDone).length;

  var h='<header class="top">'
   +'<p class="kick"><span>Path to production</span><span>&middot;</span><span>Six on the Dial</span>'
   +'<span>&middot;</span><span>Web live &mdash; stores not started</span></p>'
   +'<h1>Six on the Dial Path to Production</h1>'
   +'<p class="sub">Every open item against the ten-stage spine, in three tracks. The web game ships today at <strong>sixonthedial.com</strong>. What is left is almost entirely <strong>decisions and accounts, not code</strong> &mdash; and one blocker that no amount of engineering will clear. Ticks save into the page.</p>'
   +'<div class="gate"><span class="mark">Blocker</span><div class="body">'
   +'<p class="t">No pack has had a real community reader</p>'
   +'<p>The bench in <em>CULTURAL_BOARD.md</em> is structured perspective, <strong>not</strong> community consultation &mdash; it says so itself. One real reader per pack is budgeted before anything ships commercially, and it has not happened for a single pack. This gates the paid half of the product, and it is the one item here that cannot be closed by writing code.</p>'
   +'</div></div><div class="bars">'
   +bar(String(blockers),'Blockers open',0,'crit')
   +bar(String(toddOpen),'Decisions on you',0,'acc')
   +bar(vDone+'/'+v.length,'Verify gates held',vDone/v.length,'ok')
   +bar(done+'/'+all,'All items',done/all,'')
   +'</div>'
   +'<div class="tracks" role="group" aria-label="Track">';
  TRACKS.forEach(function(t){
    h+='<button data-tr="'+t[0]+'" aria-pressed="'+(tr===t[0])+'">'+t[1]+'</button>';
  });
  h+='</div>';
  var doneAll=ITEMS.filter(isDone).length;
  h+='<div class="tracks showdone"><button id="togdone" aria-pressed="'+(!!STATE.showDone)+'">'
   +(STATE.showDone?'Hide the '+doneAll+' done':'Show the '+doneAll+' done')+'</button></div>';
  h+='</header>';

  STAGES.forEach(function(st,idx){
    var n=idx+1, list=shown.filter(function(i){return i.s===n;});
    if(!list.length) return;
    var d=list.filter(isDone).length;
    /*
     * Done work collapses by default, because a board is read to find what is
     * LEFT. Sixty-odd finished items above four open ones buries the four, and
     * the count in the stage header carries the progress just as well as the
     * struck-through lines did.
     */
    var open=STATE.showDone?list:list.filter(function(i){return !isDone(i);});
    var hidden=list.length-open.length;
    h+='<div class="stage'+(d===list.length?' clear':'')+(open.length?'':' folded')+'"><div class="stage-hd">'
     +'<span class="stage-n">'+st[0]+'</span><span class="stage-t">'+st[1]+'</span>'
     +(hidden?'<span class="fold">'+hidden+' done</span>':'')
     +'<span class="stage-c">'+d+'/'+list.length+'</span></div>';
    if(!open.length){ h+='</div>'; return; }
    h+='<ul class="items">';
    open.forEach(function(it){
      var on=isDone(it);
      h+='<li class="item'+(on?' done':'')+'">'
       +'<button class="box" role="checkbox" aria-checked="'+on+'" data-k="'+it.k+'"'
       +(STATE.readOnly?' disabled':'')+' aria-label="'+esc(it.t.replace(/&[a-z]+;/g,' '))+'">'+CHECK+'</button>'
       +'<div class="body"><p class="title">'+txt(it.t)
       +(it.tag?'<span class="tag '+it.tag+'">'+(it.tag==='todd'?'your call':it.tag)+'</span>':'')
       +'</p>'+(it.n?'<p class="note">'+txt(it.n)+'</p>':'')+'</div></li>';
    });
    h+='</ul></div>';
  });

  h+='<footer><span>Six on the Dial &middot; NGW Systems</span>'
   +'<span>Companion to STORE_READINESS.md</span></footer>';
  document.getElementById('app').innerHTML=h;
  wire();
}
function bar(n,l,frac,cls){
  return '<div class="bar '+cls+'"><span class="n">'+txt(n)+'</span><span class="l">'+l+'</span>'
       +'<div class="track"><div class="fill" style="width:'+Math.round(Math.max(0,Math.min(1,frac||0))*100)+'%"></div></div></div>';
}
function wire(){
  Array.prototype.forEach.call(document.querySelectorAll('.box'),function(b){
    b.addEventListener('click',function(){
      var k=b.dataset.k, it=ITEMS.filter(function(i){return i.k===k;})[0];
      STATE.done[k]=isDone(it)?0:1;
      render(); schedule();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.tracks button[data-tr]'),function(b){
    /*
     * A TRACK IS A VIEW PREFERENCE, NOT SHARED STATE.
     *
     * This used to call schedule(), so merely switching tabs published a new
     * version of the page for every viewer and woke the authoring session with
     * a change notification. Ticks are the record and belong in the document;
     * which tab you were last looking at is yours alone. Local only.
     */
    b.addEventListener('click',function(){ STATE.track=b.dataset.tr; render(); schedule(true); });
  });
  /* Showing or hiding finished work is a view preference, not shared state —
     same reasoning as the track switcher, which used to publish a version per
     tab switch. Local only. */
  var tg=document.getElementById('togdone');
  if(tg) tg.addEventListener('click',function(){ STATE.showDone=!STATE.showDone; render(); schedule(true); });
}

/* ---------- persistence: localStorage always, artifact publish when available ---------- */
var chip=document.getElementById('chip'),api=null,timer=null;
function say(msg,warn,sticky){
  chip.textContent=msg; chip.className='savechip on'+(warn?' warn':'');
  if(!sticky) setTimeout(function(){ chip.className='savechip'; },2200);
}
function b64decode(b){
  var bin=atob(b),bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

var PH_STATE='__'+'STATE'+'__', PH_SRC='__'+'SRC'+'__';
function docHtml(){
  return b64decode(SRC)
    .replace(PH_STATE,JSON.stringify(STATE).replace(/</g,'\\u003c'))
    .replace(PH_SRC,SRC);
}
function schedule(localOnly){
  try{ localStorage.setItem(LS,JSON.stringify(STATE)); }catch(e){}
  if(localOnly||STATE.readOnly||!api) return;
  clearTimeout(timer); say('Saving…',false,true);
  timer=setTimeout(save,1400);
}
function save(){
  api.publish(docHtml()).then(function(){ say('Saved to the page'); }).catch(function(e){
    var c=e&&e.code;
    if(c==='conflict') return;                 /* every view reloads to the winner */
    if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='capability_disabled'){
      STATE.readOnly=true; render(); say('Read-only view — ticks stay in this browser',true,true); return;
    }
    say('Not saved to the page ('+(c||'error')+') — kept in this browser',true,true);
  });
}

/* restore any local ticks made before the page could publish */
try{
  var saved=JSON.parse(localStorage.getItem(LS)||'null');
  if(saved&&saved.done&&Object.keys(STATE.done).length===0){ STATE.done=saved.done; STATE.track=saved.track||STATE.track; }
}catch(e){}
render();
(window.claude&&window.claude.use?window.claude.use('artifact'):Promise.resolve(null))
  .then(function(a){
    api=a;
    if(!a) say('Progress saves in this browser only',true,true);
  })
  .catch(function(){});
</script>
</body>
</html>
